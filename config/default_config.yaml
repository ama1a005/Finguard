# FinGuard-RAG Default Configuration - India-Specific

# System Configuration
system:
  name: "FinGuard-RAG"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  debug_mode: false
  
# Jurisdiction Configuration
jurisdiction:
  default_jurisdiction: "India"
  supported_jurisdictions: ["India"]
  regulatory_update_frequency_days: 30
  auto_compliance_check: true

# RBI Configuration (Reserve Bank of India)
rbi:
  enabled: true
  master_circulars_url: "https://www.rbi.org.in/Scripts/NotificationUser.aspx"
  compliance_checks:
    - "capital_adequacy"
    - "kyc_verification"
    - "loan_loss_provisions"
    - "large_exposures"
  risk_thresholds:
    capital_adequacy_tier1: 9.0  # Percentage
    capital_adequacy_tier2: 6.0  # Percentage
    large_exposure_limit: 25.0   # Percentage of Tier 1 capital

# SEBI Configuration (Securities and Exchange Board of India)
sebi:
  enabled: true
  regulations_url: "https://www.sebi.gov.in/sebi_data/attachdocs/1678351650506.pdf"
  compliance_checks:
    - "disclosure_requirements"
    - "corporate_governance"
    - "insider_trading_prevention"
    - "investor_protection"
  disclosure_hours: 24
  independent_director_minimum_percentage: 33.33

# IND-AS Configuration (Indian Accounting Standards)
accounting:
  standard: "IND-AS"
  mandatory_for_companies: true
  implementations:
    - "IND-AS-1"
    - "IND-AS-8"
    - "IND-AS-36"
    - "IND-AS-109"
  annual_impairment_check: true

# FEMA Configuration (Foreign Exchange Management Act)
fema:
  enabled: true
  fdi_policy_url: "https://dpiit.gov.in/foreign-direct-investment"
  regulations:
    - "FDI_Policy"
    - "LRS" # Liberalised Remittance Scheme
    - "ECB" # External Commercial Borrowing
  remittance_limits:
    annual_usd: 250000
    per_transaction_usd: 250000

# Bank-Specific Thresholds
banking:
  kyc_renewal_frequency_days: 365
  aml_monitoring_days: 30
  transaction_monitoring_limit_inr: 500000
  suspicious_activity_alert: true
  daily_transaction_limit_inr: 10000000
  pbft_verification: true

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "logs/finguard.log"
  audit_log_file: "logs/audit.log"
  max_file_size_mb: 100
  backup_count: 10
  enable_console_logging: true

# Database Configuration
database:
  type: "postgresql"  # or sqlite for development
  host: "localhost"
  port: 5432
  name: "finguard_db"
  username: "${DB_USERNAME}"
  password: "${DB_PASSWORD}"
  pool_size: 10
  max_overflow: 20

# Embedding Configuration
embeddings:
  model: "sentence-transformers/distilbert-base-multilingual-cased"
  embedding_dimension: 768
  batch_size: 32
  cache_embeddings: true
  cache_location: "data/embeddings/"

# LLM Configuration
llm:
  provider: "openai"  # openai, huggingface, local
  model: "gpt-4"
  temperature: 0.1  # Lower for compliance-critical tasks
  max_tokens: 2000
  top_p: 0.95
  frequency_penalty: 0.0
  presence_penalty: 0.0
  timeout_seconds: 60

# Retrieval Configuration
retrieval:
  top_k_documents: 5
  similarity_threshold: 0.7
  policy_aware_filtering: true
  time_versioning_enabled: true
  consider_jurisdiction: true
  consider_role: true
  consider_regulatory_scope: true
  risk_scoring_weight: 0.3  # Weight for compliance risk vs semantic relevance

# Generation Configuration
generation:
  use_compliance_verification: true
  compliance_verification_model: "neuro_symbolic"
  safety_constraints_enabled: true
  governance_filtering_enabled: true
  max_generation_attempts: 3
  fallback_response_enabled: true

# Compliance Configuration
compliance:
  rules_engine_enabled: true
  rules_file: "data/compliance_rules/rules.json"
  automatic_rule_enforcement: true
  violation_severity_threshold: "medium"  # block high/critical, warn medium/low
  audit_all_compliance_checks: true
  jurisdiction_conflict_detection: true

# Security Configuration
security:
  leakage_detection_enabled: true
  role_inference_defense_enabled: true
  encryption_enabled: true
  encryption_algorithm: "AES-256"
  audit_logging_enabled: true
  rate_limiting_enabled: true
  rate_limit_queries_per_minute: 60
  require_tls: true
  tls_version: "1.3"

# Data Protection
data_protection:
  dpdp_compliance: true
  pii_masking: true
  pii_detection_model: "microsoft/presidio"
  sensitive_data_logging_disabled: true
  data_retention_days: 365
  auto_delete_old_logs: true

# State-Level Compliance
states:
  track_state_regulations: true
  state_specific_compliance: true
  multi_state_conflict_resolution: true

# Cache Configuration
caching:
  enabled: true
  cache_type: "redis"  # redis, memcached, local
  redis_host: "localhost"
  redis_port: 6379
  cache_ttl_seconds: 3600
  cache_embeddings: true

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  timeout_seconds: 30
  enable_cors: false
  max_request_size_mb: 10

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_enabled: true
  health_check_interval_seconds: 30
  log_queries: true
  log_compliance_violations: true
  track_compliance_metrics: true

# Feature Flags
features:
  policy_aware_retrieval: true
  time_versioned_retrieval: true
  compliance_verified_generation: true
  leakage_detection: true
  role_inference_defense: true
  jurisdiction_conflict_resolution: true
  risk_aware_scoring: true
  multi_language_support: false  # Future enhancement

# Regulatory Update Configuration
regulatory_updates:
  auto_check_updates: true
  update_check_frequency_hours: 24
  notify_on_major_changes: true
  notification_email: "${ADMIN_EMAIL}"
  archive_old_versions: true
  version_retention_count: 5

# Audit and Compliance Reporting
reporting:
  generate_daily_compliance_reports: true
  report_output_format: "pdf"  # pdf, xlsx, csv
  report_storage_location: "reports/"
  include_violation_metrics: true
  include_security_metrics: true
  include_performance_metrics: true

# India-Specific Templates
templates:
  bank_compliance_template: "templates/bank_compliance_report_india.jinja2"
  rbi_submission_template: "templates/rbi_submission_india.jinja2"
  sebi_submission_template: "templates/sebi_submission_india.jinja2"
  audit_report_template: "templates/audit_report_india.jinja2"

# Development/Testing Configuration
development:
  mock_llm_responses: false
  enable_test_mode: false
  log_all_api_calls: true
  include_response_timing: true
  trace_compliance_decisions: true
